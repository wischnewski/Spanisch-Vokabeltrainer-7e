<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vokabeltrainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF6EC;
    --ink:#22322B;
    --teal:#2E6B66;
    --teal-dark:#1E4A46;
    --sun:#F2B93F;
    --coral:#E1583F;
    --line:#DED4BE;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Outfit',sans-serif;
    min-height:100vh;
    padding-bottom:90px;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;}
  .app{max-width:480px;margin:0 auto;padding:0 20px;}

  header.top{
    padding:28px 20px 18px;
    text-align:left;
  }
  header.top .eyebrow{
    font-size:14px;
    color:var(--teal);
    font-weight:600;
    margin-bottom:2px;
  }
  header.top h1{
    font-size:32px;
    font-weight:600;
    color:var(--teal-dark);
    line-height:1.05;
  }
  header.top .sub{
    margin-top:6px;
    font-size:15px;
    color:#5c6b62;
  }

  .view{display:none;}
  .view.active{display:block;}

  /* ---- Home / list ---- */
  .stat-row{
    display:flex;
    gap:10px;
    margin:18px 0 22px;
  }
  .stat{
    flex:1;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 14px;
  }
  .stat .num{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--teal-dark);}
  .stat .label{font-size:12.5px;color:#6b776e;margin-top:2px;}

  .action-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:24px;
  }
  .action-btn{
    background:var(--teal);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:16px 14px;
    font-family:'Outfit',sans-serif;
    font-weight:600;
    font-size:15px;
    text-align:left;
    cursor:pointer;
  }
  .action-btn.secondary{background:var(--card);color:var(--teal-dark);border:1px solid var(--line);}
  .action-btn small{display:block;font-weight:400;font-size:12.5px;opacity:0.85;margin-top:3px;}
  .action-btn.secondary small{opacity:0.6;}

  .section-title{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:#8a9389;
    margin:22px 0 10px;
    font-weight:600;
  }

  .vocab-item{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .vocab-item .words{display:flex;flex-direction:column;gap:1px;}
  .vocab-item .es{font-weight:600;color:var(--ink);font-size:15.5px;}
  .vocab-item .de{font-size:13.5px;color:#7a857c;}
  .vocab-item .del{
    background:none;border:none;color:#c2a;
    color:#b6564a;font-size:13px;cursor:pointer;padding:6px;
  }
  .empty-hint{
    color:#8a9389;
    font-size:14.5px;
    padding:18px 0;
    text-align:center;
  }

  .unit-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:8px;
  }
  .unit-chip{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 13px;
    text-align:left;
    cursor:pointer;
    font-family:'Outfit',sans-serif;
  }
  .unit-chip .u-name{font-weight:600;font-size:14.5px;color:var(--teal-dark);}
  .unit-chip .u-count{font-size:12px;color:#8a9389;margin-top:2px;}
  .unit-chip.wide{grid-column:1 / -1;}

  select.field-select{
    width:100%;
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 13px;
    font-family:'Outfit',sans-serif;
    font-size:16px;
    background:#fff;
    color:var(--ink);
  }

  /* ---- bottom nav ---- */
  nav.tabbar{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--card);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 12px calc(10px + env(safe-area-inset-bottom));
    z-index:20;
  }
  nav.tabbar button{
    flex:1;background:none;border:none;
    font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;
    color:#9aa39a;padding:6px 4px;cursor:pointer;
  }
  nav.tabbar button.active{color:var(--teal-dark);}
  nav.tabbar button .ic{display:block;font-size:19px;margin-bottom:2px;}

  /* ---- Add view ---- */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;color:#5c6b62;margin-bottom:5px;}
  .field input, .field textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 13px;
    font-family:'Outfit',sans-serif;
    font-size:16px;
    background:#fff;
    color:var(--ink);
  }
  .field input:focus, .field textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}

  .primary-btn{
    width:100%;
    background:var(--teal);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:15px;
    font-family:'Outfit',sans-serif;
    font-weight:600;
    font-size:15.5px;
    cursor:pointer;
  }
  .primary-btn:disabled{opacity:0.5;}
  .ghost-btn{
    width:100%;
    background:none;
    border:1px dashed var(--line);
    color:var(--teal-dark);
    border-radius:12px;
    padding:14px;
    font-family:'Outfit',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    margin-bottom:14px;
  }

  .photo-preview{
    width:100%;border-radius:12px;margin-bottom:12px;display:none;
  }

  .review-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .review-card .pair{display:flex;gap:8px;}
  .review-card input{flex:1;min-width:0;}
  .review-card .row2{display:flex;justify-content:flex-end;margin-top:6px;}
  .review-card .row2 button{
    background:none;border:none;color:#b6564a;font-size:12.5px;cursor:pointer;
  }

  .back-link{
    display:inline-block;
    color:var(--teal-dark);
    font-weight:600;
    font-size:14px;
    margin-bottom:14px;
    cursor:pointer;
  }

  /* ---- Practice ---- */
  .mode-toggle{
    display:flex;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:4px;
    margin-bottom:18px;
  }
  .mode-toggle button{
    flex:1;background:none;border:none;border-radius:9px;
    padding:9px;font-family:'Outfit',sans-serif;font-weight:600;font-size:13.5px;
    color:#7a857c;cursor:pointer;
  }
  .mode-toggle button.active{background:var(--teal);color:#fff;}

  .flash-wrap{perspective:1200px;margin-bottom:18px;}
  .flashcard{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    min-height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px 20px;
    cursor:pointer;
    position:relative;
  }
  .flashcard .tag{
    position:absolute;top:16px;left:18px;
    font-size:11.5px;font-weight:600;color:var(--teal);
    text-transform:uppercase;letter-spacing:0.04em;
  }
  .flashcard .word{
    font-family:'Fraunces',serif;
    font-size:30px;
    font-weight:600;
    color:var(--ink);
  }
  .flashcard .hint{
    position:absolute;bottom:16px;left:0;right:0;
    font-size:12px;color:#9aa39a;
  }
  .flash-controls{display:flex;gap:10px;margin-bottom:8px;}
  .flash-controls button{
    flex:1;border-radius:12px;border:none;padding:14px;
    font-family:'Outfit',sans-serif;font-weight:600;font-size:14.5px;cursor:pointer;
  }
  .flash-controls .know{background:#DCEBE0;color:#286644;}
  .flash-controls .dontknow{background:#F6DEDA;color:#A64332;}
  .progress-text{text-align:center;color:#8a9389;font-size:13px;margin-bottom:16px;}

  .quiz-q{
    font-family:'Fraunces',serif;
    font-size:26px;
    font-weight:600;
    text-align:center;
    margin:10px 0 22px;
    color:var(--ink);
  }
  .quiz-opt{
    width:100%;
    text-align:left;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    font-family:'Outfit',sans-serif;
    font-size:15.5px;
    margin-bottom:9px;
    cursor:pointer;
    color:var(--ink);
  }
  .quiz-opt.correct{background:#DCEBE0;border-color:#8ec4a1;color:#286644;font-weight:600;}
  .quiz-opt.wrong{background:#F6DEDA;border-color:#e0a698;color:#A64332;font-weight:600;}
  .quiz-score{
    text-align:center;color:#6b776e;font-size:14px;margin-bottom:6px;
  }

  .center-msg{text-align:center;padding:60px 20px;color:#7a857c;}
  .center-msg h3{color:var(--teal-dark);margin-bottom:8px;}
  .spinner{
    width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--teal);
    border-radius:50%;display:inline-block;animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:var(--teal-dark);color:#fff;padding:10px 18px;border-radius:20px;
    font-size:13.5px;font-weight:600;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="app">

  <!-- HOME -->
  <div class="view active" id="view-home">
    <header class="top">
      <div class="eyebrow">¡Hola!</div>
      <h1>Vokabeltrainer</h1>
      <div class="sub">Spanisch ⇄ Deutsch</div>
    </header>

    <div class="stat-row">
      <div class="stat"><div class="num" id="stat-total">0</div><div class="label">Vokabeln</div></div>
      <div class="stat"><div class="num" id="stat-known">0</div><div class="label">Sicher gewusst</div></div>
    </div>

    <div class="action-grid">
      <button class="action-btn" onclick="goTo('practice')">Üben<small>Karten & Quiz</small></button>
      <button class="action-btn secondary" onclick="goTo('add')">Hinzufügen<small>Foto oder Text</small></button>
    </div>

    <div class="section-title">Nach Unidad üben</div>
    <div class="unit-grid" id="unit-grid"></div>

    <div class="section-title">Alle Vokabeln</div>
    <div id="vocab-list"></div>
  </div>

  <!-- ADD -->
  <div class="view" id="view-add">
    <div class="app" style="padding-top:20px;">
      <span class="back-link" onclick="goTo('home')">← Zurück</span>
      <h2 style="font-size:24px;color:var(--teal-dark);margin-bottom:16px;">Vokabeln hinzufügen</h2>

      <button class="ghost-btn" onclick="document.getElementById('photo-input').click()">📷 Foto von Vokabelliste hochladen</button>
      <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(event)">
      <img id="photo-preview" class="photo-preview">
      <div id="photo-status"></div>

      <div id="review-area"></div>

      <div class="section-title" style="margin-top:26px;">Oder manuell eingeben</div>
      <div class="field">
        <label>Spanisch</label>
        <input type="text" id="manual-es" placeholder="p.ej. la mesa">
      </div>
      <div class="field">
        <label>Deutsch</label>
        <input type="text" id="manual-de" placeholder="z.B. der Tisch">
      </div>
      <div class="field">
        <label>Unidad</label>
        <select class="field-select" id="manual-unit"></select>
      </div>
      <button class="primary-btn" onclick="addManual()">Vokabel speichern</button>
    </div>
  </div>

  <!-- PRACTICE -->
  <div class="view" id="view-practice">
    <div class="app" style="padding-top:20px;">
      <span class="back-link" onclick="goTo('home')">← Zurück</span>
      <h2 style="font-size:24px;color:var(--teal-dark);margin-bottom:16px;">Üben</h2>

      <div class="mode-toggle">
        <button id="mode-flash-btn" class="active" onclick="setMode('flash')">Karteikarten</button>
        <button id="mode-quiz-btn" onclick="setMode('quiz')">Quiz</button>
      </div>
      <div class="mode-toggle" style="margin-top:-10px;">
        <button id="dir-es-de" class="active" onclick="setDir('es-de')">ES → DE</button>
        <button id="dir-de-es" onclick="setDir('de-es')">DE → ES</button>
      </div>

      <div class="field" style="margin-top:2px;">
        <select class="field-select" id="unit-select" onchange="setUnit(this.value)"></select>
      </div>

      <div id="practice-area"></div>
    </div>
  </div>

</div>

<nav class="tabbar">
  <button id="tab-home" class="active" onclick="goTo('home')"><span class="ic">🏠</span>Start</button>
  <button id="tab-practice" onclick="goTo('practice')"><span class="ic">🎯</span>Üben</button>
  <button id="tab-add" onclick="goTo('add')"><span class="ic">➕</span>Hinzufügen</button>
</nav>

<div class="toast" id="toast"></div>

let vocab = [];
let pendingReview = [];
let currentUnit = "Alle";

// ---------- storage ----------
async function loadVocab(){
  try{
    const res = localStorage.getItem('vocab-list');
    vocab = res ? JSON.parse(res) : [];
  }catch(e){
    vocab = [];
  }
  if(vocab.length === 0){
    SEED_VOCAB.forEach(([unit, pairs])=>{
      pairs.forEach(([es,de])=>{
        vocab.push({es, de, unit, known:false});
      });
    });
    await saveVocab();
  }
  populateUnitSelects();
  renderHome();
}
async function saveVocab(){
  try{
    localStorage.setItem('vocab-list', JSON.stringify(vocab));
  }catch(e){
    showToast('Speichern fehlgeschlagen');
  }
}

// ---------- nav ----------
function goTo(view){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('active'));
  const tab = document.getElementById('tab-'+view);
  if(tab) tab.classList.add('active');
  if(view==='practice') renderPractice();
  if(view==='home') renderHome();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

// ---------- home ----------
function populateUnitSelects(){
  const manualSel = document.getElementById('manual-unit');
  if(manualSel){
    manualSel.innerHTML = UNITS.map(u=>`<option value="${escapeAttr(u)}">${escapeHtml(u)}</option>`).join('');
  }
  const practiceSel = document.getElementById('unit-select');
  if(practiceSel){
    practiceSel.innerHTML = `<option value="Alle">Alle Unidades</option>` + UNITS.map(u=>`<option value="${escapeAttr(u)}">${escapeHtml(u)}</option>`).join('');
    practiceSel.value = currentUnit;
  }
}

function renderUnitGrid(){
  const grid = document.getElementById('unit-grid');
  grid.innerHTML = UNITS.map(u=>{
    const count = vocab.filter(v=>v.unit===u).length;
    return `<button class="unit-chip" onclick="practiceUnit('${escapeAttr(u)}')">
      <div class="u-name">${escapeHtml(u)}</div>
      <div class="u-count">${count} Vokabeln</div>
    </button>`;
  }).join('') + `<button class="unit-chip wide" onclick="practiceUnit('Alle')">
      <div class="u-name">Alle Unidades</div>
      <div class="u-count">${vocab.length} Vokabeln</div>
    </button>`;
}
function practiceUnit(u){
  currentUnit = u;
  goTo('practice');
}

function renderHome(){
  document.getElementById('stat-total').textContent = vocab.length;
  document.getElementById('stat-known').textContent = vocab.filter(v=>v.known).length;
  renderUnitGrid();
  const list = document.getElementById('vocab-list');
  if(vocab.length===0){
    list.innerHTML = '<div class="empty-hint">Noch keine Vokabeln. Füge welche über ein Foto oder manuell hinzu.</div>';
    return;
  }
  list.innerHTML = vocab.slice().reverse().map(v=>{
    const idx = vocab.indexOf(v);
    return `<div class="vocab-item">
      <div class="words"><span class="es">${escapeHtml(v.es)}</span><span class="de">${escapeHtml(v.de)}</span><span class="de" style="color:#a9b3a4;">${escapeHtml(v.unit||'')}</span></div>
      <button class="del" onclick="deleteVocab(${idx})">Löschen</button>
    </div>`;
  }).join('');
}
function deleteVocab(idx){
  vocab.splice(idx,1);
  saveVocab();
  renderHome();
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- add manual ----------
function addManual(){
  const es = document.getElementById('manual-es').value.trim();
  const de = document.getElementById('manual-de').value.trim();
  const unit = document.getElementById('manual-unit').value;
  if(!es || !de){ showToast('Bitte beide Felder ausfüllen'); return; }
  vocab.push({es, de, unit, known:false});
  saveVocab();
  document.getElementById('manual-es').value='';
  document.getElementById('manual-de').value='';
  showToast('Vokabel gespeichert');
  renderHome();
}

// ---------- photo -> vocab extraction ----------
function handlePhoto(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    const dataUrl = e.target.result;
    const preview = document.getElementById('photo-preview');
    preview.src = dataUrl;
    preview.style.display = 'block';
    const base64 = dataUrl.split(',')[1];
    const mediaType = file.type || 'image/jpeg';
    await extractVocabFromImage(base64, mediaType);
  };
  reader.readAsDataURL(file);
}

async function extractVocabFromImage(base64, mediaType){
  const statusEl = document.getElementById('photo-status');
  statusEl.innerHTML = '<span class="spinner"></span> Foto wird gelesen…';
  document.getElementById('review-area').innerHTML = '';
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
            { type: "text", text: "Auf diesem Foto stehen spanische Vokabeln, teils mit deutscher Übersetzung. Extrahiere alle Wort-/Ausdruckspaare Spanisch-Deutsch, die du erkennen kannst. Wenn nur die spanische Seite sichtbar ist, übersetze selbst ins Deutsche. Antworte AUSSCHLIESSLICH mit einem JSON-Array, keine Erklärung, keine Markdown-Backticks, Format: [{\"es\":\"...\",\"de\":\"...\"}, ...]" }
          ]
        }]
      })
    });
    const data = await response.json();
    const text = data.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    const clean = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    if(!Array.isArray(parsed) || parsed.length===0){
      statusEl.innerHTML = 'Es konnten keine Vokabeln erkannt werden. Bitte manuell eingeben.';
      return;
    }
    pendingReview = parsed.filter(p=>p.es && p.de);
    statusEl.innerHTML = pendingReview.length + ' Vokabeln gefunden. Bitte prüfen und speichern:';
    renderReview();
  }catch(err){
    statusEl.innerHTML = 'Das Foto konnte nicht gelesen werden. Bitte erneut versuchen oder manuell eingeben.';
  }
}

let reviewUnit = UNITS[0];
function renderReview(){
  const area = document.getElementById('review-area');
  if(pendingReview.length===0){ area.innerHTML=''; return; }
  area.innerHTML = `
    <div class="field">
      <label>Zu welcher Unidad gehören diese Vokabeln?</label>
      <select class="field-select" id="review-unit" onchange="reviewUnit=this.value">
        ${UNITS.map(u=>`<option value="${escapeAttr(u)}" ${u===reviewUnit?'selected':''}>${escapeHtml(u)}</option>`).join('')}
      </select>
    </div>
  ` + pendingReview.map((p,i)=>`
    <div class="review-card">
      <div class="pair">
        <input type="text" value="${escapeHtml(p.es)}" oninput="pendingReview[${i}].es=this.value">
        <input type="text" value="${escapeHtml(p.de)}" oninput="pendingReview[${i}].de=this.value">
      </div>
      <div class="row2"><button onclick="removePending(${i})">Entfernen</button></div>
    </div>
  `).join('') + `<button class="primary-btn" style="margin-top:6px;" onclick="saveReviewed()">Alle speichern</button>`;
}
function removePending(i){
  pendingReview.splice(i,1);
  renderReview();
}
function saveReviewed(){
  pendingReview.forEach(p=>{
    if(p.es && p.de) vocab.push({es:p.es.trim(), de:p.de.trim(), unit:reviewUnit, known:false});
  });
  saveVocab();
  pendingReview = [];
  document.getElementById('review-area').innerHTML='';
  document.getElementById('photo-status').innerHTML='';
  document.getElementById('photo-preview').style.display='none';
  showToast('Vokabeln gespeichert');
  renderHome();
}

let quizScore = 0;
let quizAnswered = false;

function setMode(m){
  mode = m;
  document.getElementById('mode-flash-btn').classList.toggle('active', m==='flash');
  document.getElementById('mode-quiz-btn').classList.toggle('active', m==='quiz');
  renderPractice();
}
function setDir(d){
  dir = d;
  document.getElementById('dir-es-de').classList.toggle('active', d==='es-de');
  document.getElementById('dir-de-es').classList.toggle('active', d==='de-es');
  renderPractice();
}
function setUnit(u){
  currentUnit = u;
  renderPractice();
}

function activeVocab(){
  return currentUnit === 'Alle' ? vocab : vocab.filter(v=>v.unit===currentUnit);
}

function shuffledIndices(pool){
  const idxs = pool.map((_,i)=>i);
  for(let i=idxs.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [idxs[i],idxs[j]]=[idxs[j],idxs[i]];
  }
  return idxs;
}

function renderPractice(){
  const selEl = document.getElementById('unit-select');
  if(selEl) selEl.value = currentUnit;
  const area = document.getElementById('practice-area');
  const pool = activeVocab();
  if(pool.length < (mode==='quiz'?4:1)){
    area.innerHTML = `<div class="center-msg"><h3>Noch zu wenige Vokabeln</h3><p>${mode==='quiz' ? (currentUnit==='Alle' ? 'Für das Quiz werden mindestens 4 Vokabeln benötigt.' : 'Für das Quiz werden in dieser Unidad mindestens 4 Vokabeln benötigt. Wähle "Alle Unidades" oder eine andere Unidad.') : 'Füge zuerst ein paar Vokabeln hinzu.'}</p></div>`;
    return;
  }
  if(mode==='flash'){
    flashOrder = shuffledIndices(pool);
    flashIdx = 0;
    flashFlipped = false;
    renderFlash();
  }else{
    quizOrder = shuffledIndices(pool);
    quizIdx = 0;
    quizScore = 0;
    quizAnswered = false;
    renderQuiz();
  }
}

function renderFlash(){
  const pool = activeVocab();
  const area = document.getElementById('practice-area');
  if(flashIdx >= flashOrder.length){
    area.innerHTML = `<div class="center-msg"><h3>Geschafft! 🎉</h3><p>Alle Karten durchgegangen.</p></div><button class="primary-btn" onclick="renderPractice()">Nochmal</button>`;
    return;
  }
  const v = pool[flashOrder[flashIdx]];
  const front = dir==='es-de' ? v.es : v.de;
  const back = dir==='es-de' ? v.de : v.es;
  const frontTag = dir==='es-de' ? 'Spanisch' : 'Deutsch';
  const backTag = dir==='es-de' ? 'Deutsch' : 'Spanisch';
  area.innerHTML = `
    <div class="progress-text">${flashIdx+1} / ${flashOrder.length}</div>
    <div class="flash-wrap">
      <div class="flashcard" onclick="flashFlipped=!flashFlipped; renderFlash();">
        <span class="tag">${flashFlipped ? backTag : frontTag}</span>
        <div class="word">${escapeHtml(flashFlipped ? back : front)}</div>
        <span class="hint">Tippen zum Umdrehen</span>
      </div>
    </div>
    <div class="flash-controls">
      <button class="dontknow" onclick="markFlash(false)">Nochmal üben</button>
      <button class="know" onclick="markFlash(true)">Weiß ich</button>
    </div>
  `;
}
function markFlash(known){
  const pool = activeVocab();
  const v = pool[flashOrder[flashIdx]];
  v.known = known;
  saveVocab();
  flashIdx++;
  flashFlipped = false;
  renderFlash();
}

function renderQuiz(){
  const pool = activeVocab();
  const area = document.getElementById('practice-area');
  if(quizIdx >= quizOrder.length){
    area.innerHTML = `<div class="center-msg"><h3>Fertig! 🎉</h3><p>${quizScore} von ${quizOrder.length} richtig.</p></div><button class="primary-btn" onclick="renderPractice()">Nochmal</button>`;
    return;
  }
  const v = pool[quizOrder[quizIdx]];
  const question = dir==='es-de' ? v.es : v.de;
  const correctAnswer = dir==='es-de' ? v.de : v.es;
  // build 3 distractors (pull from whole vocab for more variety, excluding current)
  const others = vocab.filter(x=>x!==v);
  const shuffledOthers = others.slice().sort(()=>Math.random()-0.5);
  const distractors = shuffledOthers.slice(0,3).map(o=> dir==='es-de' ? o.de : o.es);
  const options = [correctAnswer, ...distractors].sort(()=>Math.random()-0.5);
  quizAnswered = false;

  area.innerHTML = `
    <div class="quiz-score">Punkte: ${quizScore} · Frage ${quizIdx+1} / ${quizOrder.length}</div>
    <div class="quiz-q">${escapeHtml(question)}</div>
    <div id="quiz-options">
      ${options.map(opt=>`<button class="quiz-opt" onclick="answerQuiz(this, '${escapeAttr(opt)}', '${escapeAttr(correctAnswer)}')">${escapeHtml(opt)}</button>`).join('')}
    </div>
  `;
}
function escapeAttr(s){
  return (s||'').replace(/'/g, "\\'");
}
function answerQuiz(btn, chosen, correct){
  if(quizAnswered) return;
  quizAnswered = true;
  const allBtns = document.querySelectorAll('#quiz-options .quiz-opt');
  allBtns.forEach(b=>{
    if(b.textContent === correct) b.classList.add('correct');
    b.disabled = true;
  });
  if(chosen === correct){
    quizScore++;
  }else{
    btn.classList.add('wrong');
  }
  setTimeout(()=>{
    quizIdx++;
    renderQuiz();
  }, 900);
}

loadVocab();
</script>
</body>
</html>
